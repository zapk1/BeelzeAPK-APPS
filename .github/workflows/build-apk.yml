name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Unzip the BeelzeAPK project
        run: |
          ZIP=$(ls *.zip | head -n 1)
          if [ -z "$ZIP" ]; then echo "No .zip found in the repo root"; exit 1; fi
          echo "Found project: $ZIP"
          unzip -o "$ZIP" -d src
          ls -la src

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: src
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -f "$SM" ]; then yes | "$SM" --licenses > /dev/null 2>&1 || true; fi
          gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: src/app/build/outputs/apk/debug/*.apk

      - name: Publish APK as a Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: src/app/build/outputs/apk/debug/*.apk
